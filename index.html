<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
<!-- Import maps polyfill -->
<!-- Remove this when import maps will be widely supported -->
<script async src="https://unpkg.com/es-module-shims@1.3.6/dist/es-module-shims.js"></script>

<script type="importmap">
  {
                "imports": {
                        "three": "https://unpkg.com/three@0.174.0/build/three.module.js"
                }
        }
</script>
<script type="module" src="marble_arena_prototype.js"></script>
<div id="sudden-death-label" style="
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 28px;
  color: red;
  font-weight: bold;
  text-shadow: 2px 2px black;
  display: none;
  z-index: 10;
">
  ⚠️ SUDDEN DEATH MODE ⚠️
</div>

  <div id="mobile-ui" style="display:none">
    <div id="mobile-buttons">
      <button class="btn-mobile" id="btn-fire">Fire</button>
      <button class="btn-mobile" id="btn-dash">Dash</button>
      <button class="btn-mobile" id="btn-jump">Jump</button>
    </div>
    <button class="btn-mobile btn-mobile-secondary" id="btn-fullscreen">Fullscreen</button>
  </div>
  <div id="tilt-indicator"><div id="tilt-dot"></div></div>
 <div id="hud">
    <div style="margin-bottom: 4px;">Dash</div>
    <div class='dash-bar' style='width: 100px; height: 6px; background: #222; border: 1px solid #555; margin-bottom: 6px;'>
      <div id='player-dash-bar' style='width: 100%; height: 100%; background: #00f;'></div>
    </div>
    <div style="margin-bottom: 4px;">Player</div>
    <div class='health-bar' style='width: 100px; height: 10px; background: #222; border: 1px solid #555;'>
      <div id='player-health-bar' style='width: 100%; height: 100%; background: #0f0;'></div>
    </div>
  </div>

<div id="scoreboard" style="
  position: fixed;
  top: 10px;
  right: 10px;
  background: rgba(0,0,0,0.6);
  color: white;
  padding: 10px;
  font-family: sans-serif;
  font-size: 14px;
  border-radius: 6px;
  z-index: 10;
">
  <div><strong>Player Lives:</strong> <span id="score-lives">0</span></div>
  <div><strong>CPU 1 Lives:</strong> <span id="score-cpu-0">0</span></div>
  <div><strong>CPU 2 Lives:</strong> <span id="score-cpu-1">0</span></div>
  <div><strong>CPU 3 Lives:</strong> <span id="score-cpu-2">0</span></div>
  <hr>
  <div><strong>Kill Feed:</strong></div>
  <div id="kill-feed" style="max-height: 100px; overflow-y: auto;"></div>
</div>

<div id="match-summary" style="
  display: none;
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(0,0,0,0.9);
  color: white;
  padding: 30px;
  font-family: sans-serif;
  border-radius: 10px;
  z-index: 20;
  text-align: center;
">
  <h2>Match Over</h2>
  <div id="summary-stats"></div>
  <button id="match-restart-btn">Play Again</button>
</div>
</body></html>
